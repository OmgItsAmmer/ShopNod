# Everything for local development and CI (run from backend/):  docker compose --env-file .env up --build
# Shop dashboard: http://localhost:3000   Shopper view: http://localhost:3000/shopper   API: http://localhost:8000/docs   MCP: http://localhost:8001/mcp
name: shopnod

x-python-env: &python-env
  DATABASE_URL: postgresql://shopnod:shopnod@postgres:5432/shopnod
  REDIS_URL: redis://redis:6379/0
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL_AGENT: ${OPENAI_MODEL_AGENT:-gpt-4o}
  OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-4o-mini}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-jwt-signing-key-change-me-0123456789}
  QR_SIGNING_KEY: ${QR_SIGNING_KEY:-}
  MCP_AGENT_TOKEN_SECRET: ${MCP_AGENT_TOKEN_SECRET:-dev-only-mcp-agent-token-secret-change-me-0123456789}
  MCP_INTERNAL_URL: http://mcp:8001/mcp
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@shopnod.local}
  SHOP_WEB_URL: ${SHOP_WEB_URL:-http://localhost:3000}
  SHOPPER_WEB_URL: ${SHOPPER_WEB_URL:-http://localhost:3000/shopper}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
  MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8001}
  DEMO_MODE: ${DEMO_MODE:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: shopnod, POSTGRES_PASSWORD: shopnod, POSTGRES_DB: shopnod }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shopnod"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  api:
    build: { context: ., target: api }
    environment: *python-env
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  mcp:
    build: { context: ., target: mcp }
    environment: *python-env
    ports: ["8001:8001"]
    depends_on: { api: { condition: service_healthy } }

  # Celery worker + beat. Beat is the scheduler: keep exactly ONE replica of this service.
  worker:
    build: { context: ., target: worker }
    environment: *python-env
    depends_on: { api: { condition: service_healthy } }

  shop-web:
    build:
      context: ../shopkeeper-web
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
