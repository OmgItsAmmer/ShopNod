name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: shopnod, POSTGRES_PASSWORD: shopnod, POSTGRES_DB: shopnod }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopnod" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopnod:shopnod@localhost:5432/shopnod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev,ai]"
      - name: Lint
        run: ruff check .
      - name: Single Alembic head (CI fails if the history has more than one)
        run: test "$(alembic heads | wc -l)" = "1"
      - name: Migrate a real Postgres, twice (idempotent) and seed
        run: |
          alembic upgrade head
          python seed/seed.py
          python seed/seed.py
      - name: Tests (SQLite) with coverage
        run: pytest -q --cov=shopnod_core --cov=shopnod_api --cov=shopnod_mcp --cov=shopnod_worker
      - name: Validator coverage is 100%
        run: pytest -q tests/test_validator.py --cov=shopnod_core.guardrails --cov-fail-under=100
      - name: Whole suite again, against real Postgres
        run: SHOPNOD_TEST_DATABASE_URL="$DATABASE_URL" pytest -q

  shopkeeper-web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: shopkeeper-web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: shopkeeper-web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: npm ci
      - run: pip install -e "../backend[dev,ai]"
      - name: Generated types match the committed copy
        run: npm run types:check
      - run: npm run test:theme
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, shopkeeper-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          docker build --target api -t shopnod-api backend
          docker build --target mcp -t shopnod-mcp backend
          docker build --target worker -t shopnod-worker backend
          docker build -t shopnod-shop-web shopkeeper-web

  e2e:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: shopkeeper-web/package-lock.json }
      - run: npm ci
        working-directory: shopkeeper-web
      # The tests call backend/seed/dev_claim.py (stands in for the shopper app) against the compose Postgres.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e backend
      - name: Start the stack
        run: docker compose up -d --build --wait
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: shopkeeper-web/e2e
      - name: Shopkeeper end-to-end (Plan 3 adds the shopper side and the full loop)
        run: npx playwright test
        working-directory: shopkeeper-web/e2e
        env:
          E2E_BASE_URL: "http://localhost:3000"
          E2E_PYTHON: python
          E2E_DATABASE_URL: postgresql://shopnod:shopnod@localhost:5433/shopnod
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: shopkeeper-web/e2e/playwright-report }
      - run: docker compose logs --no-color
        if: failure()
        working-directory: backend
