name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: shopnod, POSTGRES_PASSWORD: shopnod, POSTGRES_DB: shopnod }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopnod" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopnod:shopnod@localhost:5432/shopnod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,ai]"
      - name: Lint
        run: ruff check services infra
      - name: Single Alembic head (CI fails if the history has more than one)
        run: test "$(alembic heads | wc -l)" = "1"
      - name: Migrate a real Postgres, twice (idempotent) and seed
        run: |
          alembic upgrade head
          python infra/seed/seed.py
          python infra/seed/seed.py
      - name: Tests (SQLite) with coverage
        run: pytest -q --cov=shopnod_core --cov=shopnod_api --cov=shopnod_mcp --cov=shopnod_worker
      - name: Validator coverage is 100%
        run: pytest -q services/tests/test_validator.py --cov=shopnod_core.guardrails --cov-fail-under=100
      - name: Whole suite again, against real Postgres
        run: SHOPNOD_TEST_DATABASE_URL="$DATABASE_URL" pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: npm ci
      - run: pip install -e ".[dev,ai]"
      - name: Generated types match the committed copy
        run: npm run types:check
      - run: npm run test:theme
      - run: npm run test -w shop-web
      - run: npm run typecheck -w shop-web
      - run: npm run build -w shop-web

  images:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          docker build -f infra/docker/python.Dockerfile --target api -t shopnod-api .
          docker build -f infra/docker/python.Dockerfile --target mcp -t shopnod-mcp .
          docker build -f infra/docker/python.Dockerfile --target worker -t shopnod-worker .
          docker build -f infra/docker/shop-web.Dockerfile -t shopnod-shop-web .

  e2e:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start the stack
        run: docker compose -f infra/compose.yaml up -d --build --wait
      - run: npx playwright install --with-deps chromium
      - name: Shopkeeper end-to-end (Plan 3 adds the shopper side and the full loop)
        run: npx playwright test
        working-directory: tests/e2e
        env: { E2E_BASE_URL: "http://localhost:3000" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: tests/e2e/playwright-report }
      - run: docker compose -f infra/compose.yaml logs --no-color
        if: failure()
