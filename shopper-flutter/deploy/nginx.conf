# shopper-web: the Flutter web build as a static single-page app.
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  location / {
    try_files $uri /index.html;
  }
  # Hashed/large assets can be cached; the entry points must always be fresh so new deploys show up.
  location ~* \.(?:js|wasm|png|jpg|svg|otf|ttf|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }
  location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }
}
