[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopnod-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "stripe>=10.0",
  "pywebpush>=2.0",
  "mcp>=1.2",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "geohash2>=1.1",
]

[project.optional-dependencies]
ai = ["openai-agents>=0.0.15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
packages = [
  "shopnod_core", "shopnod_core.guardrails", "shopnod_core.agents",
  "shopnod_api", "shopnod_api.routers", "shopnod_api.routers.shopper", "shopnod_api.routers.shop",
  "shopnod_api.routers.auth", "shopnod_api.routers.admin", "shopnod_api.routers.webhooks",
  "shopnod_mcp",
  "shopnod_worker", "shopnod_worker.tasks", "shopnod_worker.tasks.shopper", "shopnod_worker.tasks.shop",
  "shopnod_worker.tasks.sim", "shopnod_worker.tasks.ops",
]

[tool.setuptools.package-dir]
shopnod_core = "services/core"
"shopnod_core.guardrails" = "services/core/guardrails"
"shopnod_core.agents" = "services/core/agents"
shopnod_api = "services/api"
"shopnod_api.routers" = "services/api/routers"
"shopnod_api.routers.shopper" = "services/api/routers/shopper"
"shopnod_api.routers.shop" = "services/api/routers/shop"
"shopnod_api.routers.auth" = "services/api/routers/auth"
"shopnod_api.routers.admin" = "services/api/routers/admin"
"shopnod_api.routers.webhooks" = "services/api/routers/webhooks"
shopnod_mcp = "services/mcp"
shopnod_worker = "services/worker"
"shopnod_worker.tasks" = "services/worker/tasks"
"shopnod_worker.tasks.shopper" = "services/worker/tasks/shopper"
"shopnod_worker.tasks.shop" = "services/worker/tasks/shop"
"shopnod_worker.tasks.sim" = "services/worker/tasks/sim"
"shopnod_worker.tasks.ops" = "services/worker/tasks/ops"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "E501", "B008", "UP035", "UP046", "UP047", "B904", "UP041"]

[tool.ruff.lint.isort]
known-first-party = ["shopnod_core", "shopnod_api", "shopnod_mcp", "shopnod_worker"]

[tool.coverage.run]
omit = ["services/tests/*", "services/migrations/*"]
